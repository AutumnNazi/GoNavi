# Server-context snippet: fixed GoNavi font library namespace only.
location = /gonavi/fonts/v1/catalog.json {
    try_files $uri =404;
    disable_symlinks on;
    limit_except GET { deny all; }
    types { application/json json; }
    default_type application/json;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD" always;
}

location ~ "^/gonavi/fonts/v1/assets/[0-9a-f]{64}[.]ttf$" {
    try_files $uri =404;
    disable_symlinks on;
    limit_except GET { deny all; }
    types { font/ttf ttf; }
    default_type font/ttf;
    gzip off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD" always;
}

location ~ "^/gonavi/fonts/v1/licenses/[0-9a-f]{64}[.]txt$" {
    try_files $uri =404;
    disable_symlinks on;
    limit_except GET { deny all; }
    types { text/plain txt; }
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD" always;
}

location /gonavi/fonts/v1/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
}
