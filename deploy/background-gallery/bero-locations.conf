# Server-context snippet for the existing Bero :8443 origin only.
# Embedded verbatim in deploy/download-mirror/bero-origin-download.conf.
# GET implicitly permits HEAD in Nginx; no preflight or credentialed CORS.
location = /gonavi/backgrounds/v1/catalog.json {
    try_files $uri =404;
    disable_symlinks on;
    limit_except GET { deny all; }
    default_type application/json;
    types { application/json json; }
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD" always;
}

location ~ "^/gonavi/backgrounds/v1/assets/[0-9a-f]{64}[.](?:webp|jpg)$" {
    try_files $uri =404;
    disable_symlinks on;
    limit_except GET { deny all; }
    default_type image/webp;
    types { image/webp webp; image/jpeg jpg; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD" always;
}

location ~ "^/gonavi/backgrounds/v1/licenses/[0-9a-f]{64}[.]txt$" {
    try_files $uri =404;
    disable_symlinks on;
    limit_except GET { deny all; }
    default_type text/plain;
    types { text/plain txt; }
    charset utf-8;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD" always;
}

# A normal prefix (not ^~) leaves only the anchored allowlist regexes above usable.
location /gonavi/backgrounds/v1/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
}
