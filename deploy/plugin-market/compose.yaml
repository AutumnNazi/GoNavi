# Local development only. Supply credentials through your environment; no defaults.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gonavi_market_test
      POSTGRES_USER: gonavi_market
      POSTGRES_PASSWORD: ${MARKET_POSTGRES_PASSWORD:?set a local database password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gonavi_market -d gonavi_market_test"]
      interval: 5s
      timeout: 3s
      retries: 12
  market:
    build:
      context: ../..
      dockerfile: deploy/plugin-market/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GONAVI_MARKET_DATABASE_URL: ${GONAVI_MARKET_DATABASE_URL:?set a PostgreSQL URL pointing to postgres:5432}
      GONAVI_MARKET_PUBLIC_URL: http://localhost:8090
      GONAVI_MARKET_GITHUB_CLIENT_ID: ${GONAVI_MARKET_GITHUB_CLIENT_ID:-}
      GONAVI_MARKET_GITHUB_CLIENT_SECRET: ${GONAVI_MARKET_GITHUB_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - artifacts:/data/artifacts
      - logs:/data/logs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=160m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
volumes:
  postgres:
  artifacts:
  logs:
