server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 43.139.148.5;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://43.139.148.5$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 43.139.148.5;

    # Publicly trusted IP SAN certificate. Never replace with a self-signed
    # certificate and never disable TLS verification in clients or probes.
    ssl_certificate /etc/letsencrypt/live/43.139.148.5/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.139.148.5/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/gonavi-cdn/public;
    access_log /var/log/nginx/gonavi-download-access.log;
    error_log /var/log/nginx/gonavi-download-error.log warn;
    client_max_body_size 1m;
    autoindex off;
    etag on;
    max_ranges 8;
    sendfile on;
    tcp_nopush on;

    location = /healthz {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:gonavi|drivers)/(?:dev/)?releases/latest/ {
        try_files $uri =404;
        limit_except GET { deny all; }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:gonavi|drivers)/(?:dev/)?releases/download/ {
        try_files $uri =404;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000,immutable" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
