# Bero reserves :443 for sing-box. Cloudflare supports proxied HTTPS on :8443,
# so this source serves its dedicated Cloudflare hostname on that port only.
# The Origin CA certificate must cover the hostname, never the origin IP.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name origin-download.syngnat.top;

    ssl_certificate /etc/ssl/cloudflare/origin-download.syngnat.top.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-download.syngnat.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/gonavi-downloads;
    access_log /var/log/nginx/gonavi-origin-download-access.log;
    error_log /var/log/nginx/gonavi-origin-download-error.log warn;

    client_max_body_size 1m;
    autoindex off;
    etag on;
    max_ranges 8;

    location = /healthz {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:gonavi|drivers)/(?:dev/)?releases/latest/ {
        try_files $uri =404;
        limit_except GET { deny all; }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:gonavi|drivers)/(?:dev/)?releases/download/ {
        try_files $uri =404;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 01–06 缎带为 SVG；07–16 吉祥物的预览图为 WebP、关于页大图与标题栏标识为 PNG。
    location ~ "^/gonavi/brand-assets/v1/[0-9]{2}-[a-z0-9-]+\\.(?:svg|webp|png)$" {
        try_files $uri =404;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
            image/svg+xml svg;
            image/webp webp;
            image/png png;
        }
        default_type application/octet-stream;
    }

    # BEGIN background-gallery v1 (kept in sync with the standalone snippet)
    # Server-context snippet for the existing Bero :8443 origin only.
    # Embedded verbatim in deploy/download-mirror/bero-origin-download.conf.
    # GET implicitly permits HEAD in Nginx; no preflight or credentialed CORS.
    location = /gonavi/backgrounds/v1/catalog.json {
        try_files $uri =404;
        disable_symlinks on;
        limit_except GET { deny all; }
        default_type application/json;
        types { application/json json; }
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
    }

    location ~ "^/gonavi/backgrounds/v1/assets/[0-9a-f]{64}[.](?:webp|jpg)$" {
        try_files $uri =404;
        disable_symlinks on;
        limit_except GET { deny all; }
        default_type image/webp;
        types { image/webp webp; image/jpeg jpg; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
    }

    location ~ "^/gonavi/backgrounds/v1/licenses/[0-9a-f]{64}[.]txt$" {
        try_files $uri =404;
        disable_symlinks on;
        limit_except GET { deny all; }
        default_type text/plain;
        types { text/plain txt; }
        charset utf-8;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
    }

    # A normal prefix (not ^~) leaves only the anchored allowlist regexes above usable.
    location /gonavi/backgrounds/v1/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }
    # END background-gallery v1

    # BEGIN font-gallery v1
    # Server-context snippet: fixed GoNavi font library namespace only.
    location = /gonavi/fonts/v1/catalog.json {
        try_files $uri =404;
        disable_symlinks on;
        limit_except GET { deny all; }
        types { application/json json; }
        default_type application/json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
    }

    location ~ "^/gonavi/fonts/v1/assets/[0-9a-f]{64}[.]ttf$" {
        try_files $uri =404;
        disable_symlinks on;
        limit_except GET { deny all; }
        types { font/ttf ttf; }
        default_type font/ttf;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
    }

    location ~ "^/gonavi/fonts/v1/licenses/[0-9a-f]{64}[.]txt$" {
        try_files $uri =404;
        disable_symlinks on;
        limit_except GET { deny all; }
        types { text/plain txt; }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD" always;
    }

    location /gonavi/fonts/v1/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }
    # END font-gallery v1

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
