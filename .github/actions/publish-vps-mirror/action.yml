name: Publish verified download mirror
description: Publish immutable assets to the DMIT static edge before mutable pointers and KV control

inputs:
  channel: { required: true, description: stable or dev }
  app-tag: { required: true, description: Physical application release tag }
  app-dir: { required: true, description: Application release assets }
  app-manifest: { required: true, description: Mutable application manifest }
  driver-enabled: { required: true, description: Whether driver assets are included }
  driver-tag: { required: false, default: '', description: Physical driver release tag }
  driver-dir: { required: false, default: '', description: Driver release assets }
  driver-version-index: { required: false, default: '', description: Versioned driver index }
  driver-latest-index: { required: false, default: '', description: Mutable driver index }
  dmit-ssh-host: { required: true, description: DMIT SSH host }
  dmit-ssh-port: { required: true, description: DMIT SSH port }
  dmit-ssh-user: { required: true, description: Restricted gonavi-cdn user }
  dmit-ssh-private-key: { required: true, description: DMIT deployment key }
  dmit-ssh-known-hosts: { required: true, description: Pinned DMIT host key }
  cloudflare-account-id: { required: true, description: Cloudflare account ID }
  cloudflare-api-token: { required: true, description: Token restricted to Workers KV Storage Write }
  routing-state-kv-id: { required: true, description: Download dispatcher routing KV namespace ID }
  throughput-warning-mbps: { required: false, default: '20', description: Observability-only public eight-Range warning threshold }
  dmit-max-bytes: { required: false, default: '9000000000', description: Maximum DMIT mirror bytes }
  dmit-reserve-free-bytes: { required: false, default: '2000000000', description: Minimum free bytes preserved on DMIT }

runs:
  using: composite
  steps:
    - name: Validate GUI update manifest for dispatcher publication
      shell: bash
      env:
        PUB_CHANNEL: ${{ inputs.channel }}
        PUB_APP_TAG: ${{ inputs.app-tag }}
        PUB_APP_DIR: ${{ inputs.app-dir }}
        PUB_APP_MANIFEST: ${{ inputs.app-manifest }}
      run: |
        set -euo pipefail
        case "${PUB_CHANNEL}" in
          stable) download_path_prefix=/gonavi/releases/download ;;
          dev) download_path_prefix=/gonavi/dev/releases/download ;;
          *) echo "Invalid publication channel: ${PUB_CHANNEL}" >&2; exit 1 ;;
        esac
        python3 "${GITHUB_WORKSPACE}/tools/validate-gui-update-manifest.py" \
          --channel "${PUB_CHANNEL}" \
          --app-tag "${PUB_APP_TAG}" \
          --app-dir "${PUB_APP_DIR}" \
          --manifest "${PUB_APP_MANIFEST}" \
          --github-repository "${GITHUB_REPOSITORY}" \
          --download-dispatcher-url "https://download-dispatch.syngnat.top/v1/resolve" \
          --download-path-prefix "${download_path_prefix}"

    - name: Publish verified static edges and KV control
      shell: bash
      env:
        PUB_CHANNEL: ${{ inputs.channel }}
        PUB_APP_TAG: ${{ inputs.app-tag }}
        PUB_APP_DIR: ${{ inputs.app-dir }}
        PUB_APP_MANIFEST: ${{ inputs.app-manifest }}
        PUB_DRIVER_ENABLED: ${{ inputs.driver-enabled }}
        PUB_DRIVER_TAG: ${{ inputs.driver-tag }}
        PUB_DRIVER_DIR: ${{ inputs.driver-dir }}
        PUB_DRIVER_VERSION_INDEX: ${{ inputs.driver-version-index }}
        PUB_DRIVER_LATEST_INDEX: ${{ inputs.driver-latest-index }}
        PUB_GENERATION: ${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
        PUB_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PUB_CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        PUB_ROUTING_STATE_KV_ID: ${{ inputs.routing-state-kv-id }}
        PUB_THROUGHPUT_WARN_MBPS: ${{ inputs.throughput-warning-mbps }}
        EDGE_DMIT_HOST: ${{ inputs.dmit-ssh-host }}
        EDGE_DMIT_PORT: ${{ inputs.dmit-ssh-port }}
        EDGE_DMIT_USER: ${{ inputs.dmit-ssh-user }}
        EDGE_DMIT_PRIVATE_KEY: ${{ inputs.dmit-ssh-private-key }}
        EDGE_DMIT_KNOWN_HOSTS: ${{ inputs.dmit-ssh-known-hosts }}
        EDGE_DMIT_ROOT: /srv/gonavi-downloads
        EDGE_DMIT_BASE_URL: https://download.syngnat.top
        EDGE_DMIT_MAX_BYTES: ${{ inputs.dmit-max-bytes }}
        EDGE_DMIT_RESERVE_FREE_BYTES: ${{ inputs.dmit-reserve-free-bytes }}
      run: bash "${GITHUB_WORKSPACE}/tools/publish-edge-release.sh"
